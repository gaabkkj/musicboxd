<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Musicboxd</title>

  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: linear-gradient(-45deg, #1e1b3a, #2a2750, #1c1f7a, #0c0f5a);
  background-size: 400% 400%;
  animation: gradientBG 12s ease infinite;

  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* HEADER */

header {
  width: 100%;
  display: flex;
  align-items: center;
  padding: 20px 40px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: bold;
}

.logo span {
  font-size: 14px;
  opacity: 0.7;
}

.profile {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #d79a5b;
}

/* HERO CENTRAL (AGORA EM CARD) */

.hero {
  margin-top: 80px;
  background: #2a2750;
  padding: 50px 40px;
  border-radius: 20px;
  text-align: center;
  max-width: 700px;
  width: 90%;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);

  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 0.8s ease forwards;
}

.tag {
  opacity: 0;
  animation: fadeUp 0.8s ease forwards;
  animation-delay: 0.2s;
}

h1 {
  opacity: 0;
  animation: fadeUp 0.8s ease forwards;
  animation-delay: 0.4s;
}

.subtitle {
  opacity: 0;
  animation: fadeUp 0.8s ease forwards;
  animation-delay: 0.6s;
}

.buttons {
  opacity: 0;
  animation: fadeUp 0.8s ease forwards;
  animation-delay: 0.8s;
}


/* TÍTULO */

h1 {
  font-size: 42px;
  line-height: 1.3;
  margin-bottom: 20px;
}

h1 span {
  color: #f4a261;
}

/* SUBTEXTO */

.subtitle {
  font-size: 16px;
  opacity: 0.75;
  margin-bottom: 30px;
}

/* BOTÕES */

.buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
}

.btn {
  padding: 14px 22px;
  border-radius: 10px;
  font-size: 15px;
  text-decoration: none;
  transition: 0.2s;
}

.btn-primary {
  background: linear-gradient(135deg, #f4a261, #e76f51);
  color: #fff;
}

.btn-primary:hover {
  opacity: 0.9;
}

.btn-secondary {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
}

.btn-secondary:hover {
  background: rgba(255,255,255,0.05);
}

@keyframes gradientBG {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
  </style>
</head>

<body>

<header>
  <div class="logo">
    🎵 musicboxd
    <span>Avalie seus álbuns favoritos</span>
  </div>

  <div class="profile">
    <div class="avatar"></div>
    Meu perfil
  </div>
</header>

<section class="hero">
  <div class="tag">🎵 A plataforma definitiva para amantes da música</div>

  <h1>
    Descubra e avalie álbuns de <br>
    <span>forma simples</span>
  </h1>

  <div class="subtitle">
    Salve o que você ouviu, dê notas e acompanhe seus amigos.
  </div>

  <div class="buttons">
    <!-- BOTÃO CORRIGIDO -->
    <a href="login.html" class="btn btn-primary">Começar Agora</a>

    <a href="#" class="btn btn-secondary">Explorar Álbuns</a>
  </div>
</section>

</body>
</html>
